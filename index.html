<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Narração MP3</title>
  <!-- Biblioteca lamejs para conversão local para MP3 -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h2 { color: #333; margin-bottom: 20px; }
    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      resize: vertical;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #aaa; cursor: not-allowed; }
    .card-audio {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    audio { width: 100%; margin-bottom: 12px; }
    .btn-download {
      display: block;
      text-align: center;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn-download:hover { background-color: #218838; }
  </style>
</head>
<body>

  <h2>Gerador de Narração MP3</h2>
  <textarea id="texto" placeholder="Digite ou cole seu texto aqui..."></textarea>
  <button id="btnGerar" onclick="gerarAudio()">Gerar Áudio MP3</button>

  <div id="resultado" class="card-audio" style="display: none;">
    <h3>Seu áudio está pronto!</h3>
    <audio id="player" controls></audio>
    <a id="btnDownload" class="btn-download" download="narracao.mp3">Baixar Arquivo MP3</a>
  </div>

  <script>
    async function gerarAudio() {
      const texto = document.getElementById('texto').value.trim();
      const btnGerar = document.getElementById('btnGerar');
      const resultado = document.getElementById('resultado');
      const player = document.getElementById('player');
      const btnDownload = document.getElementById('btnDownload');

      if (!texto) {
        alert('Por favor, digite um texto!');
        return;
      }

      btnGerar.innerText = 'Gerando MP3...';
      btnGerar.disabled = true;

      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const destination = audioContext.createMediaStreamDestination();
        const mediaRecorder = new MediaRecorder(destination.stream);
        const chunks = [];

        mediaRecorder.ondataavailable = e => chunks.push(e.data);

        mediaRecorder.onstop = async () => {
          const blobWebm = new Blob(chunks, { type: 'audio/webm' });
          const arrayBuffer = await blobWebm.arrayBuffer();
          const decodedAudio = await audioContext.decodeAudioData(arrayBuffer);

          // Converte para MP3 real usando lamejs
          const mp3Blob = bufferToMp3(decodedAudio);
          const mp3Url = URL.createObjectURL(mp3Blob);

          player.src = mp3Url;
          btnDownload.href = mp3Url;
          resultado.style.display = 'block';

          btnGerar.innerText = 'Gerar Áudio MP3';
          btnGerar.disabled = false;
          audioContext.close();
        };

        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';

        // Garante a escolha de uma voz em Português
        const voices = speechSynthesis.getVoices();
        const ptVoice = voices.find(v => v.lang.includes('pt')) || voices[0];
        if (ptVoice) utterance.voice = ptVoice;

        mediaRecorder.start();
        window.speechSynthesis.speak(utterance);

        utterance.onend = () => {
          setTimeout(() => mediaRecorder.stop(), 300);
        };

      } catch (err) {
        alert('Erro ao processar o áudio. Tente novamente.');
        console.error(err);
        btnGerar.innerText = 'Gerar Áudio MP3';
        btnGerar.disabled = false;
      }
    }

    function bufferToMp3(audioBuffer) {
      const channels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
      const samples = audioBuffer.getChannelData(0);
      const sampleBlockSize = 1152;
      const mp3Data = [];

      const convertedSamples = new Int16Array(samples.length);
      for (let i = 0; i < samples.length; i++) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        convertedSamples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      for (let i = 0; i < convertedSamples.length; i += sampleBlockSize) {
        const sampleChunk = convertedSamples.subarray(i, i + sampleBlockSize);
        const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }

      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) mp3Data.push(mp3buf);

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    // Carrega as vozes do navegador
    window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  </script>

</body>
</html>
