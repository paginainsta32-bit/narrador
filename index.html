<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador e Downloader de Narração MP3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h2 { color: #333; margin-bottom: 20px; }
    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      resize: vertical;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    .card-audio {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    audio { width: 100%; margin-bottom: 12px; }
    .btn-download {
      display: block;
      text-align: center;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn-download:hover { background-color: #218838; }
  </style>
</head>
<body>

  <h2>Gerador de Narração MP3</h2>
  <textarea id="texto" placeholder="Digite ou cole seu texto aqui (recomendado até 200 caracteres por bloco para respostas mais rápidas)..."></textarea>
  <button id="btnGerar" onclick="gerarAudio()">Gerar Áudio MP3</button>

  <div id="resultado" class="card-audio" style="display: none;">
    <h3>Seu áudio está pronto!</h3>
    <audio id="player" controls></audio>
    <a id="btnDownload" class="btn-download" download="narracao.mp3">Baixar Arquivo MP3</a>
  </div>

  <script>
    async function gerarAudio() {
      const texto = document.getElementById('texto').value.trim();
      const btnGerar = document.getElementById('btnGerar');
      const resultado = document.getElementById('resultado');
      const player = document.getElementById('player');
      const btnDownload = document.getElementById('btnDownload');

      if (!texto) {
        alert('Por favor, digite um texto!');
        return;
      }

      btnGerar.innerText = 'Gerando MP3...';
      btnGerar.disabled = true;

      try {
        // Endpoint público de conversão de texto em voz do Google Translate
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(texto)}&tl=pt-BR&client=tw-ob`;
        
        // Faz a requisição e converte em Blob binário
        const response = await fetch(url);
        const blob = await response.blob();
        
        // Cria uma URL local para o arquivo MP3
        const audioUrl = URL.createObjectURL(blob);

        player.src = audioUrl;
        btnDownload.href = audioUrl;

        resultado.style.display = 'block';
      } catch (error) {
        alert('Ocorreu um erro ao gerar o áudio. Tente reduzir o tamanho do texto.');
        console.error(error);
      } finally {
        btnGerar.innerText = 'Gerar Áudio MP3';
        btnGerar.disabled = false;
      }
    }
  </script>

</body>
</html>
